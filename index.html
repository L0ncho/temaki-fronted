<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Esta línea es mágica: le dice a los celulares que adapten la pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temaki Sushi | Menú</title>
    <!-- Aquí conectamos nuestro archivo de diseño -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Encabezado de la página -->
    <header class="header">
        <img src="logo.png" alt="Logo de Temaki Sushi" class="logo-img">
        <p>El mejor sabor, directo a tu mesa</p>
    </header>

    <!-- Contenedor del Menú -->
    <main class="menu-container">
        <h2 class="category-title">Rolls Destacados</h2>
        
        <!-- Cuadrícula de productos -->
        <div class="product-grid">
            
            <!-- Tarjeta de Producto 1 -->
            <article class="card">
                <img src="https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=300&q=80" alt="Avocado Roll" class="card-img">
                <div class="card-content">
                    <h3>Avocado Roll</h3>
                    <p>Salmón, queso crema, envuelto en palta.</p>
                    <span class="price">$6.500</span>
                    <button class="btn-add" onclick="agregarAlCarrito('Avocado Roll', 6500)">Agregar al carrito</button>
                </div>
            </article>

            <!-- Tarjeta de Producto 2 -->
            <article class="card">
                <img src="https://images.unsplash.com/photo-1553621042-f6e147245754?auto=format&fit=crop&w=300&q=80" alt="Tempura Roll" class="card-img">
                <div class="card-content">
                    <h3>Tempura Roll</h3>
                    <p>Camarón, cebollín, queso crema, frito en panko.</p>
                    <span class="price">$7.200</span>
                    <button class="btn-add" onclick="agregarAlCarrito('Tempura Roll', 7200)">Agregar al carrito</button>
                </div>
            </article>

        </div>
    </main>
    <!-- Contenedor del Carrito de Compras -->
    <aside class="cart-container">
        <h2>Tu Pedido</h2>
        
        <!-- Lista vacía donde JavaScript inyectará los productos -->
        <ul id="lista-carrito"></ul>
        <!-- Formulario de Datos del Cliente -->
        <div class="customer-data">
            <input type="text" id="cliente-nombre" placeholder="Tu Nombre (Ej: Alonso)" class="form-input">
            
            <select id="cliente-metodo" class="form-input" onchange="toggleDireccion()">
                <option value="delivery">Delivery</option>
                <option value="retiro">Retiro en Tienda</option>
            </select>

            <input type="text" id="cliente-direccion" placeholder="Dirección (Ej: Av. San Martín, Viña del Mar)" class="form-input">
        </div>
        <!-- Total a pagar -->
        <div class="cart-total">
            <h3>Total: $<span id="total-precio">0</span></h3>
            <button class="btn-checkout" onclick="enviarAWhatsApp()">Enviar a WhatsApp</button>
        </div>
    </aside>
<script src="app.js"></script>
</body>
</html>
