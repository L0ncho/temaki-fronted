<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temaki Sushi | Menú</title>
    <meta name="description" content="Pide sushi, handrolls, gohan y entradas de Temaki Sushi en Puchuncaví. Delivery y retiro en tienda, pedidos por WhatsApp de 18:30 a 23:00 hrs.">
    <meta name="theme-color" content="#234326">

    <!-- Vista previa al compartir el link (WhatsApp, Instagram, Facebook) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://temaki-fronted.vercel.app/">
    <meta property="og:image" content="https://temaki-fronted.vercel.app/logo.png">
    <meta property="og:image:width" content="280">
    <meta property="og:image:height" content="295">
    <meta property="og:image:alt" content="Logo de Temaki Sushi">
    <meta property="og:locale" content="es_CL">
    <meta property="og:title" content="Temaki Sushi | Menú">
    <meta property="og:description" content="Sushi, handrolls y gohan en Puchuncaví. Arma tu pedido y envíalo por WhatsApp.">

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <script src="tema.js"></script>
</head>
<body>

    <header class="header">
        <button type="button" id="btn-tema" class="btn-tema" onclick="cambiarTema()">🌓 Auto</button>
        <img src="logo.png" alt="Logo de Temaki Sushi" class="logo-img" width="280" height="295">
        <p class="header-subtitulo">Roll, Gohan, Handroll & variedad</p>
        <p class="header-horario" id="horario-hoy">🕒 Horario de atención: 18:30 a 23:00 hrs</p>
        <button class="btn-ver-carrito" onclick="abrirCarrito()">Ver mi pedido (<span id="contador-carrito">0</span>)</button>
    </header>

    <main class="menu-container">
        <h2 class="category-title">Nuestra Carta</h2>
        <div class="buscador">
            <label for="buscador-menu" class="sr-only">Buscar en la carta</label>
            <input type="search" id="buscador-menu" class="form-input" placeholder="🔍 Buscar tabla, handroll, gohan..." oninput="buscarProducto()">
        </div>

        <div class="filtros-menu">
            <button class="btn-filtro activo" onclick="filtrarMenu('Todos', this)">Todos</button>
            <button class="btn-filtro" onclick="filtrarMenu('Tablas', this)">Tablas</button>
            <button class="btn-filtro" onclick="filtrarMenu('Handrolls', this)">Handrolls</button>
            <button class="btn-filtro" onclick="filtrarMenu('Gohan', this)">Gohan</button>
            <button class="btn-filtro" onclick="filtrarMenu('Entradas', this)">Entradas</button>
        </div>

        <div id="contenedor-productos" class="product-grid" aria-live="polite">
        </div>
    </main>

    <button class="btn-flotante" onclick="abrirCarrito()">
        🛒 Ver Pedido (<span id="contador-flotante">0</span>)
    </button>

    <div class="modal-overlay" id="modal-carrito">

        <aside class="cart-container" role="dialog" aria-modal="true" aria-labelledby="titulo-carrito">
            <div class="cart-header">
                <h2 id="titulo-carrito">Tu Pedido</h2>
                <button class="btn-cerrar" onclick="cerrarCarrito()" aria-label="Cerrar pedido">❌</button>
            </div>

            <ul id="lista-carrito"></ul>

            <fieldset class="extras-carrito">
                <legend>¿Deseas agregar algo más?</legend>
                <div class="opciones-extras">
                    <label>
                        <input type="checkbox" class="chk-extra" value="2000" data-nombre="Extra Palta" onchange="actualizarPantalla()">
                        Extra Palta (+$2.000)
                    </label>
                    <label>
                        <input type="checkbox" class="chk-extra" value="700" data-nombre="Extra Soya" onchange="actualizarPantalla()">
                        Extra Soya (+$700)
                    </label>
                    <label>
                        <input type="checkbox" class="chk-extra" value="800" data-nombre="Salsa Teriyaki" onchange="actualizarPantalla()">
                        Salsa Teriyaki (+$800)
                    </label>
                </div>
            </fieldset>

            <div class="customer-data">
                <label for="cliente-nombre" class="sr-only">Tu nombre</label>
                <input type="text" id="cliente-nombre" placeholder="Tu Nombre (Ej: Alonso)" class="form-input" autocomplete="name">

                <label for="cliente-metodo" class="sr-only">Método de entrega</label>
                <select id="cliente-metodo" class="form-input" onchange="toggleDireccion()">
                    <option value="delivery">🛵 Delivery</option>
                    <option value="retiro">🏪 Retiro en Tienda</option>
                </select>

                <p id="info-retiro" class="info-retiro" hidden></p>

                <div id="campos-delivery" class="campos-delivery">
                    <!-- El value de cada opción es el costo de despacho en pesos; data-nombre es lo que llega a WhatsApp. -->
                    <label for="cliente-comuna" class="sr-only">Zona de despacho</label>
                    <select id="cliente-comuna" class="form-input" onchange="actualizarPantalla()">
                        <option value="">Selecciona tu zona...</option>
                        <option value="5000" data-nombre="Altos el Rungue">Altos el Rungue (+$5.000)</option>
                        <option value="2500" data-nombre="Campiche">Campiche (+$2.500)</option>
                        <option value="4000" data-nombre="Chocota">Chocota (+$4.000)</option>
                        <option value="3500" data-nombre="El Médano">El Médano (+$3.500)</option>
                        <option value="2500" data-nombre="El Paso">El Paso (+$2.500)</option>
                        <option value="2500" data-nombre="El Rincón">El Rincón (+$2.500)</option>
                        <option value="3000" data-nombre="El Rungue">El Rungue (+$3.000)</option>
                        <option value="5000" data-nombre="Horcón">Horcón (+$5.000)</option>
                        <option value="3500" data-nombre="La Greda">La Greda (+$3.500)</option>
                        <option value="5500" data-nombre="Laguna">Laguna (+$5.500)</option>
                        <option value="4500" data-nombre="Los Maquis">Los Maquis (+$4.500)</option>
                        <option value="5000" data-nombre="Maitencillo">Maitencillo (+$5.000)</option>
                        <option value="4500" data-nombre="Maitenes">Maitenes (+$4.500)</option>
                        <option value="6000" data-nombre="Marbella Adentro">Marbella Adentro (+$6.000)</option>
                        <option value="4000" data-nombre="Pucalan">Pucalan (+$4.000)</option>
                        <option value="2000" data-nombre="Puchuncaví">Puchuncaví (+$2.000)</option>
                        <option value="2500" data-nombre="San Antonio">San Antonio (+$2.500)</option>
                        <option value="4000" data-nombre="Ventanas">Ventanas (+$4.000)</option>
                    </select>

                    <label for="cliente-direccion" class="sr-only">Dirección</label>
                    <input type="text" id="cliente-direccion" placeholder="Dirección (Ej: Los Pinos 123, Ventanas)" class="form-input" autocomplete="street-address">
                </div>

                <label for="cliente-instrucciones" class="sr-only">Instrucciones especiales</label>
                <textarea id="cliente-instrucciones" placeholder="Instrucciones especiales (Ej: Sin soya, extra wasabi)" class="form-input" rows="2"></textarea>
            </div>

            <div class="cart-total">
                <h3 id="total-precio">Total: $0</h3>
                <button class="btn-checkout" onclick="enviarAWhatsApp()">Enviar a WhatsApp</button>
                <button class="btn-vaciar" onclick="vaciarCarrito()">🗑️ Vaciar pedido</button>
            </div>
        </aside>
    </div>

    <footer class="site-footer">
        <a href="https://www.instagram.com/sushitemaki__/" target="_blank" rel="noopener noreferrer" class="footer-instagram" aria-label="Síguenos en Instagram">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <circle cx="12" cy="12" r="4"></circle>
                <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
            </svg>
            <span>Síguenos en Instagram</span>
        </a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"
            integrity="sha384-YB/DdIkloKoRpclWB8bNcYXWakt57USgtQPDzvnIDHYU0lasD5eWlXVo1S4ODukY"
            crossorigin="anonymous"></script>
    <script src="horarios.js"></script>
    <script src="app.js"></script>
</body>
</html>
